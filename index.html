<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qwik Service Voice Assistant</title>

  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --accent: #155eef;
      --success: #067647;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(100%, 560px);
      background: var(--card);
      border: 1px solid #eaecf0;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 12px 34px rgba(16, 24, 40, 0.08);
    }

    .eyebrow {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 30px;
      line-height: 1.15;
    }

    .intro {
      margin: 0 0 26px;
      color: var(--muted);
      line-height: 1.5;
    }

    .status {
      margin-top: 16px;
      min-height: 22px;
      font-size: 14px;
    }

    .status.success {
      color: var(--success);
    }

    .status.error {
      color: var(--danger);
    }

    .information {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #eaecf0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <main class="page">
    <section class="card">

      <div class="eyebrow">Qwik Service</div>

      <h1>Call our AI service assistant</h1>

      <p class="intro">
        Start a voice call with our AI service assistant to book, manage,
        or check your vehicle service appointment.
      </p>

      <div id="status" class="status" aria-live="polite"></div>

      <div class="information">
        During the call, the assistant may ask you for information required
        to verify your identity and manage your service appointment.
      </div>

    </section>
  </main>


  <!-- Cognigy Click To Call Endpoint configuration -->
  <script>
    const COGNIGY_ENDPOINT_CONFIG_URL =
      "https://endpoint-trial.cognigy.ai/ae1a1effa1cdc7f21a9eb8c5c5972abacb5e044fcf85b4abf3a4620fcb25911b";
  </script>


  <!-- Official Cognigy Click To Call widget -->
  <script src="https://github.com/Cognigy/click-to-call-widget/releases/latest/download/webRTCWidget.js"></script>


  <script>

    let cognigyWidget = null;

    const statusEl = document.getElementById("status");


    function setStatus(message, type = "") {

      statusEl.textContent = message;

      statusEl.className =
        "status" + (type ? " " + type : "");

    }


    async function initialiseCognigyWidget() {

      if (!COGNIGY_ENDPOINT_CONFIG_URL) {

        setStatus(
          "Cognigy Click To Call is not configured.",
          "error"
        );

        return;
      }


      if (typeof window.initWebRTCWidget !== "function") {

        setStatus(
          "The Cognigy Click To Call widget could not be loaded.",
          "error"
        );

        return;
      }


      try {

        cognigyWidget =
          await window.initWebRTCWidget(
            COGNIGY_ENDPOINT_CONFIG_URL
          );


        cognigyWidget.on(
          "newRTCSession",
          function (session) {

            setStatus(
              "Call connected.",
              "success"
            );


            session.on(
              "ended",
              function () {

                setStatus(
                  "Call ended."
                );

              }
            );


            session.on(
              "terminated",
              function () {

                setStatus(
                  "Call ended."
                );

              }
            );

          }
        );


        setStatus(
          "Ready. Use the Cognigy call button to speak with our service assistant.",
          "success"
        );


      } catch (error) {

        console.error(error);

        setStatus(
          "Unable to initialise Cognigy Click To Call.",
          "error"
        );

      }

    }


    window.addEventListener(
      "load",
      initialiseCognigyWidget
    );

  </script>

</body>
</html>
